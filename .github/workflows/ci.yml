name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: alxwlw/stack/.github/actions/setup@v1
      - run: pnpm exec stack check
      - run: pnpm exec moon run :lint :format :typecheck :test
      - name: Release notes for every unreleased version
        run: bun packages/release/src/cli.ts check
      - name: gitleaks по всей истории
        run: gitleaks git --redact --no-banner .
      - run: proto run actionlint -- -color
      - run: git ls-files -z '*.sh' | xargs -0 proto run shellcheck --
      - run: .github/image/test.sh
