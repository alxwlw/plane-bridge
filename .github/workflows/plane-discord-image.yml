name: plane-discord image
on:
  pull_request:
    paths:
      - 'apps/plane-discord/**'
      - 'packages/**'
      - '!packages/release/**'
      - '.github/workflows/plane-discord-image.yml'
      - '.github/workflows/image.yml'
      - '.github/smoke/plane-discord.sh'
      - '.github/image/**'
  push:
    branches: [main]
    paths:
      - 'apps/plane-discord/**'
      - 'packages/**'
      - '!packages/release/**'
      - '.github/workflows/plane-discord-image.yml'
      - '.github/workflows/image.yml'
      - '.github/smoke/plane-discord.sh'
      - '.github/image/**'
permissions:
  contents: read
  packages: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  image:
    uses: ./.github/workflows/image.yml
    with:
      app: plane-discord
      version: main
      tags: |
        main
        ${{ github.sha }}
      push: ${{ github.event_name == 'push' }}
