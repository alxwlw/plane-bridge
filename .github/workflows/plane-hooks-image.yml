name: plane-hooks image
on:
  pull_request:
    paths:
      - 'apps/plane-hooks/**'
      - 'packages/**'
      - '.github/workflows/plane-hooks-image.yml'
      - '.github/smoke/plane-hooks.sh'
  push:
    branches: [main]
    paths:
      - 'apps/plane-hooks/**'
      - 'packages/**'
      - '.github/workflows/plane-hooks-image.yml'
      - '.github/smoke/plane-hooks.sh'
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/alxwlw/plane-hooks
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/plane-hooks/Dockerfile
          platforms: linux/amd64
          load: true
          tags: plane-hooks:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke
        run: .github/smoke/plane-hooks.sh plane-hooks:smoke
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/plane-hooks/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: org.opencontainers.image.source=https://github.com/alxwlw/plane-bridge
          cache-from: type=gha
      - name: Digest
        if: github.event_name == 'push'
        run: echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
