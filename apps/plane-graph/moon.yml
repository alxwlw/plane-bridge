$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'

# The workspace packages the app imports: a change in them re-runs the app's test and typecheck.
dependsOn:
  - 'plane-app'
  - 'plane-kit'

# The canon looks at src/ and tests/; here the tests live in test/, plus scripts/ and web/.
fileGroups:
  tests:
    - 'test/**/*'
  sources:
    - 'src/**/*'
    - 'scripts/**/*'
    - 'web/**/*'

tasks:
  test:
    inputs:
      - '/packages/plane-app/src/**/*'
      - '/packages/plane-kit/src/**/*'
  # The canon lint targets src only; the appended arg adds scripts/ and web/.
  lint:
    args: 'scripts web'
  # The browser code (web/) has its own tsconfig with DOM types, which the root one cannot mix with @types/bun.
  typecheck:
    inputs:
      - '/packages/plane-app/src/**/*'
      - '/packages/plane-kit/src/**/*'
    script: 'bun run --bun $workspaceRoot/node_modules/typescript/bin/tsc --noEmit && bun run --bun $workspaceRoot/node_modules/typescript/bin/tsc --noEmit -p web'
