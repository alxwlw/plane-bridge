$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'

# The workspace packages the app imports: a change in them re-runs the app's test and typecheck.
dependsOn:
  - 'plane-app'
  - 'plane-kit'

# The canon looks at src/ and tests/; here the test directory is test/, plus scripts/.
fileGroups:
  tests:
    - 'test/**/*'
  sources:
    - 'src/**/*'
    - 'scripts/**/*'

tasks:
  test:
    inputs:
      - '/packages/plane-app/src/**/*'
      - '/packages/plane-kit/src/**/*'
  typecheck:
    inputs:
      - '/packages/plane-app/src/**/*'
      - '/packages/plane-kit/src/**/*'
